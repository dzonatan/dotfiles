onboarding = false

[theme]
name = "gruvbox"

auto_switch = false
[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"

[keys]
focus_agent = "cmd+1..9"

[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "~/.config/herdr/branch-session.sh"
description = "branch the focused Claude session"
width = 44
height = 12
