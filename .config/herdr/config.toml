onboarding = false

[theme]
name = "gruvbox"

auto_switch = false
[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"

[keys]
switch_tab = "ctrl+1..9"
switch_workspace = "cmd+1..9"
focus_agent = "ctrl+shift+1..9"
new_workspace = "prefix+n"
new_tab = "prefix+shift+n"

[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "~/.config/herdr/branch-session.sh"
description = "branch the focused Claude session"
width = 44
height = 12

[[keys.command]]
key = "prefix+c"
type = "shell"
command = "\"$HERDR_BIN_PATH\" tab create --focus"
description = "new tab without name prompt"
